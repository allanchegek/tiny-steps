<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiny Steps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tiny Steps</title>
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --ink:#22302b; --muted:#6b756f; --line:#e6ddd0;
  --accent:#2f5d50; --accent-ink:#ffffff; --soft:#e4eee8; --warn:#b5532f; --warn-soft:#f8e3d8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141917; --card:#1d2421; --ink:#ecebe6; --muted:#9aa49f; --line:#2c3531;
    --accent:#86bfaa; --accent-ink:#0f1513; --soft:#22332d; --warn:#ec9470; --warn-soft:#3a2620;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 24px}
h1,h2,h3{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.15;margin-bottom:6px}
h2{font-size:22px;line-height:1.2;margin-bottom:8px}
h3{font-size:18px;line-height:1.3}
p{margin:6px 0}
a{color:var(--accent)}
.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 4px;font-weight:600}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.next h3{font-size:20px;margin:2px 0 4px}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px;margin:0}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.alert{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:14px;padding:14px 16px;margin:14px 0}
.alert b{color:var(--warn)}
.calm{background:var(--soft);border-radius:14px;padding:12px 16px;margin:14px 0;font-size:15px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;margin:4px 4px 0 0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:0;vertical-align:middle}
.chip.hot{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.goal-top{display:flex;gap:12px;align-items:flex-start}
.rank{flex:none;width:30px;height:30px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px}
.goal.paused{opacity:.7}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.steps.flush{margin:0}.steps.flush li:first-child{border-top:0;padding-top:0}.steps.flush li:last-child{padding-bottom:0}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);background:transparent;flex:none;display:grid;place-items:center;cursor:pointer;padding:0}
.check.on{background:var(--accent)}
.check.on::after{content:"";width:10px;height:5px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
li.done .t{text-decoration:line-through;color:var(--muted)}
.st{flex:1;min-width:0}
.st .t{display:block;overflow-wrap:anywhere}
.st .m{display:block;font-size:13px;color:var(--muted)}
.more{border:0;background:transparent;color:var(--muted);font-size:20px;width:40px;height:40px;border-radius:10px;cursor:pointer;flex:none;line-height:1}
.more:hover{background:var(--soft)}
details summary{cursor:pointer;font-weight:700;color:var(--accent);margin-top:8px;list-style:none;font-size:15px}
details summary::-webkit-details-marker{display:none}
details[open] summary .arrow{transform:rotate(90deg)}
.arrow{display:inline-block;transition:transform .2s}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{min-height:88px;resize:vertical}
.seg{display:flex;gap:6px}.seg .btn{flex:1;padding:10px 6px;font-size:14px}
.seg .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.edit-step{display:flex;gap:6px;align-items:center;margin:8px 0}
.edit-step .num{width:22px;flex:none;text-align:right;color:var(--muted);font-weight:700;font-size:14px}
.edit-step input.t{flex:1;min-width:0}
.edit-step input.n{width:64px;flex:none;text-align:center;padding:12px 4px}
.edit-hint{display:flex;justify-content:flex-end;gap:6px;font-size:12px;color:var(--muted);padding-right:46px}
.empty{text-align:center;padding:28px 18px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto;justify-content:space-around;align-items:flex-end}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;cursor:pointer;min-width:64px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .plus{width:50px;height:50px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.planlist li .when{font-size:13px;color:var(--muted)}
.ok{background:var(--soft);border-radius:14px;padding:12px 14px;margin:12px 0}
.prio .t b{color:var(--accent)}
.ov{padding:10px 0;border-top:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.ov:first-of-type{border-top:0}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
ol.howto{padding-left:20px;margin:8px 0}ol.howto li{margin:4px 0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Main">
  <div class="in">
    <button class="tab" data-act="nav" data-v="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button class="tab" data-act="nav" data-v="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4v-5H4zM10 20h4V9h-4zM16 20h4V4h-4z"/></svg>Goals</button>
    <button class="tab" data-act="nav" data-v="add" aria-label="Add a goal">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Add</button>
    <button class="tab" data-act="nav" data-v="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Tiny Steps: a personal assistant that breaks goals into tiny steps ---------- */
const STORE = 'tinysteps.v1';
const DAY = 864e5;
const IMP = {3:'Must do', 2:'Should do', 1:'Nice to do'};
const MODELS = ['gemini-3.5-flash', 'gemini-2.5-flash', 'gemini-3-flash-preview', 'gemini-flash-latest'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');

/* ---------- storage ---------- */
function defaults(){ return {settings:{name:'', key:'', model:'', autoModel:'', hoursPerDay:2, remindTime:'09:00', onboarded:false}, goals:[]}; }
function loadState(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE));
    if(d && Array.isArray(d.goals)) return {settings:{...defaults().settings, ...d.settings}, goals:d.goals};
  }catch(e){}
  return defaults();
}
let S = loadState();
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){ toast('Could not save on this device'); } }

/* ---------- dates & formatting ---------- */
function todayStr(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function toLocalInput(d){ return `${todayStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function daysLeft(deadline){
  if(!deadline) return null;
  const end = new Date(deadline + 'T23:59:59');
  return Math.ceil((end - new Date()) / DAY);
}
function dlText(dl){
  if(dl === null) return '';
  if(dl < 1) return dl === 0 ? 'Due today' : `${-dl} day${-dl>1?'s':''} overdue`;
  if(dl === 1) return 'Due by tomorrow';
  return `${dl} days left`;
}
function fmtWhen(iso){
  const d = new Date(iso), t = todayStr(), k = todayStr(d);
  const time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if(k === t) return 'today ' + time;
  const tm = new Date(); tm.setDate(tm.getDate()+1);
  if(k === todayStr(tm)) return 'tomorrow ' + time;
  return d.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'}) + ' ' + time;
}
function fmtMin(m){ m = Math.max(0, Math.round(m)); if(m < 60) return m + ' min'; const h = Math.floor(m/60), r = m % 60; return h + 'h' + (r ? ' ' + r + 'm' : ''); }
function remindParts(){ const [h, m] = (S.settings.remindTime || '09:00').split(':').map(Number); return [h || 9, m || 0]; }
function defaultWhen(){
  const now = new Date(), [h, m] = remindParts();
  const t = new Date(now); t.setHours(h, m, 0, 0);
  if(t > now) return t;
  const soon = new Date(now.getTime() + 60*6e4); soon.setMinutes(Math.ceil(soon.getMinutes()/15)*15, 0, 0);
  if(soon.getHours() < 21 && todayStr(soon) === todayStr(now)) return soon;
  t.setDate(t.getDate() + 1); return t;
}

/* ---------- goal maths: priority & workload ---------- */
const remaining = g => g.steps.filter(s => !s.done);
const remMin = g => remaining(g).reduce((a, s) => a + (+s.minutes || 10), 0);
function score(g){
  let sc = g.importance * 10;
  const dl = daysLeft(g.deadline);
  if(dl !== null){ if(dl < 1) sc += 25; else if(dl <= 2) sc += 20; else if(dl <= 7) sc += 12; else if(dl <= 14) sc += 6; }
  const tot = g.steps.length, done = tot - remaining(g).length;
  if(tot && done / tot >= 0.6) sc += 5;          // nearly there: finish it
  return sc;
}
const activeGoals = () => S.goals.filter(g => !g.paused && remaining(g).length);
const ranked = () => activeGoals().sort((a, b) => score(b) - score(a));
function dailyNeed(g){ const dl = daysLeft(g.deadline); return remMin(g) / (dl === null ? 14 : Math.max(dl, 1)); }
function workload(){
  const goals = ranked(), cap = (+S.settings.hoursPerDay || 2) * 60;
  const need = goals.reduce((a, g) => a + dailyNeed(g), 0);
  let acc = 0; const fits = [], over = [];
  for(const g of goals){
    const n = dailyNeed(g), dl = daysLeft(g.deadline);
    const urgentMust = g.importance === 3 && dl !== null && dl <= 7;
    const roomInDay = acc + n <= cap * 1.05, roomInHead = fits.length < 6;   // time limit and "too many things" limit
    if((roomInDay && roomInHead) || urgentMust || fits.length === 0){ acc += n; fits.push(g); } else over.push(g);
  }
  const overdue = goals.filter(g => { const d = daysLeft(g.deadline); return d !== null && d < 1 && d !== 0; });
  return {cap, need, goals, fits, over, overdue, overloaded: need > cap * 1.05 || goals.length > 6};
}
function reasons(g){
  const dl = daysLeft(g.deadline);
  return [IMP[g.importance], dl === null ? 'no deadline' : dlText(dl), `${fmtMin(remMin(g))} left`, `~${fmtMin(dailyNeed(g))}/day`].join(' · ');
}
function find(gid, sid){ const g = S.goals.find(x => x.id === gid); return {g, s: g && sid ? g.steps.find(x => x.id === sid) : null}; }

/* ---------- Gemini (free key from Google AI Studio) ---------- */
async function callGemini(prompt){
  const key = (S.settings.key || '').trim();
  if(!key) throw new Error('Add your free Gemini key in Settings first.');
  const models = [S.settings.model, S.settings.autoModel, ...MODELS].filter((m, i, a) => m && a.indexOf(m) === i);
  let lastErr;
  for(const m of models){
    let res;
    try{
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'x-goog-api-key':key},
        body: JSON.stringify({contents:[{role:'user', parts:[{text:prompt}]}], generationConfig:{responseMimeType:'application/json', temperature:0.6}})
      });
    }catch(e){ throw new Error('No internet connection, or Google could not be reached.'); }
    if(res.status === 404){ lastErr = new Error('Model not available: ' + m); continue; }
    if(res.status === 429) throw new Error("You've hit the free AI limit for now. Wait a minute and try again.");
    if(!res.ok){
      const t = await res.text().catch(() => '');
      if(/api[ _]?key|API_KEY_INVALID|PERMISSION_DENIED|unregistered callers/i.test(t)) throw new Error("That Gemini key didn't work. Check it in Settings.");
      lastErr = new Error('Google said: ' + (t.match(/"message":\s*"([^"]+)/)?.[1] || res.status)); continue;
    }
    const data = await res.json();
    const parts = data?.candidates?.[0]?.content?.parts || [];
    const text = parts.filter(p => !p.thought).map(p => p.text || '').join('');
    if(!text){ lastErr = new Error('The AI gave an empty answer. Try again.'); continue; }
    if(S.settings.autoModel !== m){ S.settings.autoModel = m; save(); }
    return parseJSON(text);
  }
  throw lastErr || new Error('Could not reach the AI.');
}
function parseJSON(t){
  try{ return JSON.parse(t); }catch(e){
    const m = t.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
    throw new Error("Couldn't read the AI's answer. Try again.");
  }
}
function cleanSteps(arr){
  return (Array.isArray(arr) ? arr : []).map(s => ({
    id: uid(),
    title: String(typeof s === 'string' ? s : (s.title || s.step || '')).trim(),
    minutes: Math.min(180, Math.max(1, parseInt(s.minutes) || 10)),
    done: false, when: null
  })).filter(s => s.title);
}
const RULES = `Rules:
- Each step starts with a verb and is ONE physical action she can do right away without more planning.
- Each step takes 2 to 25 minutes. The very first step takes under 5 minutes, so starting feels easy.
- Be specific to this goal: name the actual thing to open, write, find, buy, call or send. Never use vague steps like "plan", "research" or "work on" by themselves.
- Use simple, friendly words.`;
function breakdownPrompt(d){
  return `You are a warm, practical personal assistant for someone who easily feels overwhelmed.
Break the goal below into the SMALLEST possible concrete actions, in the order she should do them.
${RULES}
- Give 5 to 15 steps. If the goal is big, cover the first stage well and finish with a step to plan the next stage.
Today is ${todayStr()}.${d.deadline ? ' Deadline: ' + d.deadline + '.' : ''}
Goal: ${d.title.trim()}
${d.notes.trim() ? 'Extra context: ' + d.notes.trim() : ''}
Reply ONLY with JSON in this shape: {"steps":[{"title":"...","minutes":5}]}`;
}
function splitPrompt(g, s){
  return `You are a warm, practical personal assistant. This step still feels too big to start.
Split it into 2 to 6 even smaller steps, in order.
${RULES}
Overall goal: ${g.title}
Step to split: ${s.title} (about ${s.minutes} minutes)
Reply ONLY with JSON in this shape: {"steps":[{"title":"...","minutes":3}]}`;
}
function templateSteps(title){
  return cleanSteps([
    {title:`Write one sentence describing what "done" looks like for: ${title}`, minutes:3},
    {title:'List everything you need for it (things, people, info)', minutes:5},
    {title:'Circle the one thing you can do first, today', minutes:2},
    {title:'Do that first thing for 10 minutes, then stop', minutes:10},
    {title:'Write down the next action and pick a time for it', minutes:3}
  ]);
}

/* ---------- calendar ---------- */
function gcalUrl(g, s){
  const st = new Date(s.when), en = new Date(st.getTime() + (+s.minutes || 15) * 6e4);
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const p = new URLSearchParams({action:'TEMPLATE', text:'Tiny step: ' + s.title, dates: f(st) + '/' + f(en),
    details:`Goal: ${g.title}\nJust this one small step (${fmtMin(s.minutes)}). You've got this.`});
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function icsText(items){
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const e = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tiny Steps//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for(const [g, s] of items){
    const st = new Date(s.when), en = new Date(st.getTime() + (+s.minutes || 15) * 6e4);
    L.push('BEGIN:VEVENT', `UID:${s.id}@tinysteps`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(st)}`, `DTEND:${f(en)}`,
      `SUMMARY:${e('Tiny step: ' + s.title)}`, `DESCRIPTION:${e('Goal: ' + g.title)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(s.title)}`, 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
/* Spread a goal's unfinished steps over the days, keeping each day under her limit. */
function plan(g){
  const cap = (+S.settings.hoursPerDay || 2) * 60, [hh, mm] = remindParts();
  const todo = remaining(g); todo.forEach(s => s.when = null);
  const total = todo.reduce((a, s) => a + (+s.minutes || 10), 0);
  const start = new Date(); start.setHours(hh, mm, 0, 0);
  let startOffset = 0;
  if(start < new Date()){ start.setDate(start.getDate() + 1); startOffset = 1; }
  const dl = daysLeft(g.deadline);
  const span = dl === null ? Math.max(1, Math.ceil(total / 30)) : Math.max(1, dl - startOffset);
  const perDay = Math.max(10, Math.ceil(total / span));
  const load = {};
  for(const og of S.goals) if(og !== g && !og.paused) for(const s of og.steps)
    if(!s.done && s.when){ const k = todayStr(new Date(s.when)); load[k] = (load[k] || 0) + (+s.minutes || 10); }
  const cur = new Date(start); let used = 0;
  for(const s of todo){
    const m = +s.minutes || 10;
    for(let guard = 0; guard < 400; guard++){
      const other = load[todayStr(cur)] || 0;
      if(used === 0 ? other < cap : (used + m <= perDay && other + used + m <= cap)) break;
      cur.setDate(cur.getDate() + 1); cur.setHours(hh, mm, 0, 0); used = 0;
    }
    const t = new Date(cur); t.setMinutes(t.getMinutes() + (load[todayStr(cur)] || 0) + used);
    s.when = t.toISOString(); used += m + 5;
  }
  save();
  const last = todo.length ? new Date(todo[todo.length - 1].when) : null;
  return {late: !!(last && g.deadline && todayStr(last) > g.deadline)};
}

function renderToday(){
  const now = new Date(), h = now.getHours(), nm = S.settings.name, t = todayStr();
  const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  let out = `<p class="eyebrow">${now.toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'})}</p><h1>${greet}${nm ? ', ' + esc(nm) : ''}</h1>`;
  if(!S.goals.length) return out + `<div class="card empty"><h2>Nothing here yet</h2><p class="muted">Tell me one thing you want to get done. I'll make it small enough to start today.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="nav" data-v="add">Add my first goal</button></div></div>`;
  const w = workload();
  if(w.overloaded){
    out += `<div class="alert"><b>You've taken on a lot.</b><p>${w.goals.length > 6 && w.need <= w.cap * 1.05 ? `You're juggling ${w.goals.length} goals at once.` : `Your goals need about ${fmtMin(w.need)} a day, but you have ${fmtMin(w.cap)}.`}${w.overdue.length ? ` ${w.overdue.length} ${w.overdue.length > 1 ? 'are' : 'is'} past the deadline.` : ''} Let's choose what matters most.</p><div class="row"><button class="btn" data-act="prio">Help me prioritise</button></div></div>`;
  } else if(w.goals.length){
    out += `<div class="calm">You're within your limit: about ${fmtMin(w.need)} a day out of your ${fmtMin(w.cap)}.</div>`;
  }
  const todays = [], missed = [];
  let doneToday = 0;
  for(const g of S.goals){
    for(const s of g.steps){
      if(s.done && s.doneAt && todayStr(new Date(s.doneAt)) === t) doneToday++;
      if(g.paused || s.done || !s.when) continue;
      const k = todayStr(new Date(s.when));
      if(k === t) todays.push([g, s]); else if(k < t) missed.push([g, s]);
    }
  }
  todays.sort((a, b) => new Date(a[1].when) - new Date(b[1].when));
  const top = ranked();
  out += `<p class="section-title">Your next tiny steps</p>`;
  out += top.length ? top.slice(0, 3).map(g => stepCard(g, remaining(g)[0])).join('')
    : `<div class="card"><p>Everything's done. Enjoy that feeling.</p><div class="row"><button class="btn" data-act="nav" data-v="add">Add a new goal</button></div></div>`;
  if(top.length > 3) out += `<p class="muted small">Showing your top 3 goals. The other ${top.length - 3} can wait.</p>`;
  if(todays.length) out += `<p class="section-title">Scheduled for today</p><div class="card"><ul class="steps flush">${todays.map(([g, s]) => stepRow(g, s, true)).join('')}</ul></div>`;
  if(missed.length) out += `<p class="section-title">Missed. No stress, pick a new time</p><div class="card"><ul class="steps flush">${missed.map(([g, s]) => stepRow(g, s, true)).join('')}</ul></div>`;
  if(doneToday) out += `<p class="muted small center" style="margin-top:20px">You've finished ${doneToday} step${doneToday > 1 ? 's' : ''} today. Well done.</p>`;
  return out;
}

function goalCard(g, rank){

function renderGoals(){

  let out = `<h1>Your goals</h1><p class="muted">In the order I'd tackle them.</p>`;

/* ---------- actions ---------- */
const actions = {
  nav(d){ view = d.v; closeSheet(); render(); window.scrollTo(0, 0); },
  close(){ closeSheet(); },
  imp(d){ draft.importance = +d.v; render(); },
  async breakdown(){
    if(!draft.title.trim()){ toast('Write what you want to get done first'); $('#dTitle')?.focus(); return; }
    if(!S.settings.key){
      draft.steps = templateSteps(draft.title.trim());
      draft.note = 'These are general starter steps. Add a free Gemini key in Settings and I can make them specific to your goal.';
      render(); return;
    }
    draft.loading = true; draft.note = ''; render();
    try{
      const r = await callGemini(breakdownPrompt(draft));
      const steps = cleanSteps(r.steps);
      if(!steps.length) throw new Error('The AI gave back no steps. Try wording the goal differently.');
      draft.steps = steps;
    }catch(e){
      draft.note = e.message + (draft.steps.length ? '' : ' Here are some general starter steps for now.');
      if(!draft.steps.length) draft.steps = templateSteps(draft.title.trim());
    }
    draft.loading = false;
    if(view === 'add') render();
  },
  dDel(d){ draft.steps.splice(+d.i, 1); render(); },
  dAdd(){ draft.steps.push({id:uid(), title:'', minutes:10, done:false, when:null}); render(); const ins = document.querySelectorAll('.edit-step input.t'); ins[ins.length - 1]?.focus(); },
  saveGoal(){
    const steps = draft.steps.filter(s => s.title.trim()).map(s => ({...s, title:s.title.trim()}));
    if(!draft.title.trim()){ toast('Give your goal a name'); return; }
    if(!steps.length){ toast('Add at least one step'); return; }
    const g = {id:uid(), title:draft.title.trim(), notes:draft.notes.trim(), deadline:draft.deadline || null, importance:draft.importance, paused:false, created:Date.now(), steps};
    S.goals.push(g); save();
    draft = newDraft(); view = 'goals'; openGoals.add(g.id); render(); window.scrollTo(0, 0);
    openPlan(g.id, true);
  },
  done(d){
    const {g, s} = find(d.g, d.s); if(!s) return;
    s.done = !s.done; s.doneAt = s.done ? Date.now() : null; save(); render();
    if(s.done){
      const left = remaining(g);
      if(!left.length) toast(`Goal finished: ${g.title} 🎉`, 3500);
      else toast(view === 'today' ? 'Done! Next: ' + left[0].title : 'Nice one', 3000);
    }
  },
  step(d){ openStep(d.g, d.s); },
  stepSave(d){
    const {g} = find(d.g); if(!g) return;
    const title = $('#stTitle').value.trim();
    if(!title){ toast('Give the step a name'); return; }
    const minutes = Math.max(1, parseInt($('#stMin').value) || 10);
    const wv = $('#stWhen').value, when = wv ? new Date(wv).toISOString() : null;
    let s;
    if(d.s === 'new'){ s = {id:uid(), title, minutes, done:false, when}; g.steps.push(s); }
    else { s = g.steps.find(x => x.id === d.s); if(!s) return; Object.assign(s, {title, minutes, when}); }
    save(); openGoals.add(g.id); render();
    if(when) openStep(g.id, s.id, true); else { closeSheet(); toast('Saved'); }
  },
  stepDel(d){
    const {g, s} = find(d.g, d.s); if(!s) return;
    if(!confirm('Delete this step?')) return;
    g.steps = g.steps.filter(x => x !== s); save(); closeSheet(); render();
  },
  async split(d){
    const {g, s} = find(d.g, d.s); if(!s) return;
    if(!S.settings.key){ closeSheet(); toast('Add your free Gemini key in Settings to split steps automatically', 3500); return; }
    closeSheet(); toast('Breaking it into smaller steps…', 8000);
    try{
      const subs = cleanSteps((await callGemini(splitPrompt(g, s))).steps);
      if(subs.length < 2) throw new Error("Couldn't split that one. Try editing it instead.");
      const i = g.steps.indexOf(s);
      if(i < 0) return;
      g.steps.splice(i, 1, ...subs); save(); openGoals.add(g.id); render();
      toast(`Split into ${subs.length} smaller steps`);
    }catch(e){ toast(e.message, 4000); }
  },
  plan(d){ openPlan(d.g); },
  autoPlan(d){
    const {g} = find(d.g); if(!g) return;
    const r = plan(g); render(); openPlan(g.id);
    toast(r.late ? "Heads up: it won't all fit before the deadline. Consider pausing something." : 'Planned! Now add them to your calendar.', r.late ? 5000 : 3000);
  },
  ics(d){
    const {g} = find(d.g); if(!g) return;
    const items = remaining(g).filter(s => s.when).map(s => [g, s]);
    if(!items.length) return;
    download(`tiny-steps-${g.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 30)}.ics`, icsText(items), 'text/calendar');
    toast('Open the downloaded file to add the reminders', 3500);
  },
  pause(d){
    const {g} = find(d.g); if(!g) return;
    g.paused = !g.paused; save(); render();
    toast(g.paused ? 'Paused. It will wait for you.' : 'Welcome back');
    if(d.from === 'prio') openPrioritise();
  },
  later(d){
    const {g} = find(d.g); if(!g || !g.deadline) return;
    const nd = new Date(g.deadline + 'T12:00:00'); nd.setDate(nd.getDate() + 7);
    g.deadline = todayStr(nd); save(); render(); openPrioritise(); toast('Deadline moved to ' + nd.toLocaleDateString([], {day:'numeric', month:'short'}));
  },
  delGoal(d){
    const {g} = find(d.g); if(!g) return;
    if(!confirm(`Delete "${g.title}" and all its steps?`)) return;
    S.goals = S.goals.filter(x => x !== g); save(); render();
  },
  prio(){ openPrioritise(); },
  async aiPrio(){
    const out = $('#aiOut'); if(!out) return;
    if(!S.settings.key){ out.innerHTML = '<p class="small muted">Add your free Gemini key in Settings to get AI advice.</p>'; return; }
    out.innerHTML = '<p class="small muted"><span class="spin"></span> Thinking it through…</p>';
    const w = workload();
    const goals = w.goals.map(g => ({title:g.title, importance:IMP[g.importance], deadline:g.deadline || 'none', minutesLeft:remMin(g), stepsLeft:remaining(g).length}));
    try{
      const r = await callGemini(`You are a kind but honest personal assistant. She has about ${w.cap} minutes a day for her goals. Today is ${todayStr()}.
Help her decide what to focus on this week and what to pause, drop or delay, so she stops feeling overwhelmed.
Goals: ${JSON.stringify(goals)}
Reply ONLY with JSON: {"advice":"3 to 4 short, plain sentences: what to focus on, what to let go of for now, and one encouraging line","focus":["exact goal title", "... at most 3"],"pauseOrDelay":["exact goal title"]}`);
      const list = (a, cls) => (Array.isArray(a) && a.length) ? a.map(t => `<span class="chip ${cls}">${esc(t)}</span>`).join('') : '';
      out.innerHTML = `<div class="ok"><p>${esc(r.advice || '')}</p>
        ${list(r.focus, '') ? `<p class="small" style="margin-top:8px"><b>Focus:</b><br>${list(r.focus, '')}</p>` : ''}
        ${list(r.pauseOrDelay, 'hot') ? `<p class="small"><b>Pause or delay:</b><br>${list(r.pauseOrDelay, 'hot')}</p>` : ''}</div>`;
    }catch(e){ out.innerHTML = `<p class="small" style="color:var(--warn)">${esc(e.message)}</p>`; }
  },
  settingsHours(){ view = 'settings'; closeSheet(); render(); setTimeout(() => $('#sHours')?.focus(), 50); },
  async testKey(){
    const el = $('#keyStatus'); el.style.color = ''; el.innerHTML = '<span class="spin"></span> Checking…';
    try{
      await callGemini('Reply ONLY with this JSON: {"ok":true}');
      el.style.color = 'var(--accent)'; el.textContent = `Working! Using ${S.settings.autoModel}.`;
    }catch(e){ el.style.color = 'var(--warn)'; el.textContent = e.message; }
  },
  export(){ download(`tiny-steps-backup-${todayStr()}.json`, JSON.stringify(S, null, 2), 'application/json'); },
  reset(){
    if(!confirm('Erase all goals and settings on this device? This cannot be undone.')) return;
    S = defaults(); save(); draft = newDraft(); view = 'today'; render(); openWelcome();
  },
  obDone(){
    S.settings.name = $('#obName').value.trim();
    S.settings.hoursPerDay = Math.max(0.5, parseFloat($('#obHours').value) || 2);
    S.settings.onboarded = true; save(); closeSheet(); render();
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || !actions[b.dataset.act]) return;
  e.preventDefault();
  actions[b.dataset.act](b.dataset, b);
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.draft){ draft[t.dataset.draft] = t.value; }
  else if(t.dataset.dstep !== undefined){
    const s = draft.steps[+t.dataset.dstep];
    if(s) s[t.dataset.f] = t.dataset.f === 'minutes' ? Math.max(1, parseInt(t.value) || 1) : t.value;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.set){
    const k = t.dataset.set;
    S.settings[k] = k === 'hoursPerDay' ? Math.max(0.5, parseFloat(t.value) || 2) : t.value.trim();
    if(k === 'key' || k === 'model') S.settings.autoModel = '';
    save(); if(k !== 'key') toast('Saved');
  }
  if(t.id === 'importFile' && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.goals)) throw 0;
        if(!confirm('Replace everything on this device with this backup?')) return;
        S = {settings:{...defaults().settings, ...d.settings, onboarded:true}, goals:d.goals}; save(); render(); toast('Backup restored');
      }catch(err){ toast("That file doesn't look like a Tiny Steps backup"); }
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if(d.tagName === 'DETAILS' && d.dataset.gid){ d.open ? openGoals.add(d.dataset.gid) : openGoals.delete(d.dataset.gid); }
}, true);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
// Refresh the Today screen when she comes back to the app.
document.addEventListener('visibilitychange', () => { if(!document.hidden && view === 'today' && !$('#sheetBg').classList.contains('open')) render(); });

/* ---------- home-screen icon ---------- */
(function(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#2f5d50'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#f6f1e9';
    [[38, 112, 30, 30], [75, 82, 30, 60], [112, 52, 30, 90]].forEach(r => x.fillRect(...r));
    const u = c.toDataURL('image/png');
    for(const rel of ['icon', 'apple-touch-icon']){ const l = document.createElement('link'); l.rel = rel; l.href = u; document.head.appendChild(l); }
  }catch(e){}
})();

render();
if(!S.settings.onboarded) openWelcome();
</script>
</body>
</html>
